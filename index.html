<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 06: JS orientado a objetos</title>
</head>
<body>
    <h1>repositorios da discilina de design web</h1>
    <h2>data: 23/09/2026</h2>
    <table>
        <tr>
            <th>nome</th>
            <th>ações</th>
        </tr>
        <tr>
            <td>balu</td>
            <td>
                <button onclick="balu.falar()">Falar</button>
                <button onclick="balu.saudar()">Saudar</button>
                <button onclick="balu.comer(0.5)">Comer</button>
                <button onclick="balu.cagar(0.2)">Cagar</button>
            </td>
        </tr>
    </table>

    <table>
        <tr>
            <th>nome</th>
            <th>ações</th>
        </tr>
        <tr>
            <td>mel</td>
            <td>
                <button onclick="mel.falar()">Falar</button>
                <button onclick="mel.saudar()">Saudar</button>
                <button onclick="mel.comer(0.8)">Comer</button>
                <button onclick="mel.cagar(0.4)">Cagar</button>
            </td>
        </tr>
    </table>
  <script src="./js/script.js" defer></script>
</body>
</html>
